<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMI 点播学习助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/icon-48.png" width="40" height="40" alt="">
      <h1>PMI 点播学习助手</h1>
    </header>
    <section class="state" id="state" data-tone="neutral" aria-labelledby="phase">
      <p class="phase" id="phase">读取状态</p>
      <p class="target" id="target" hidden></p>
      <p class="detail" id="status" role="status" aria-atomic="true">正在连接学习助手…</p>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
    <button class="primary" id="action" type="button" disabled>正在读取状态…</button>
    <p class="hint" id="hint" hidden></p>
    <section class="recovery" id="recovery" aria-label="待核对评分" hidden>
      <button class="text-button" id="clearPending" type="button">解除待核对记录</button>
    </section>
    <details id="rules">
      <summary>运行规则</summary>
      <ul>
        <li>在 PMP/PgMP、免费、未查看的当前页中，优先选 PDU 较高的课程。</li>
        <li>请完整观看。扩展检测到播完后会提交 5 星评分，确认保存后等待 3–18 秒，再筛选下一门。</li>
        <li>停止自动流程后，当前视频和标签页会保留。</li>
      </ul>
    </details>
  </main>
  <dialog id="clearDialog" aria-labelledby="clearTitle">
    <h2 id="clearTitle">解除待核对记录？</h2>
    <p>请先到原课程页核对评分。此操作只移除本地待核对记录，网站评分保持原样。</p>
    <form method="dialog">
      <button value="cancel" autofocus>取消</button>
      <button class="primary" value="clear">解除记录</button>
    </form>
  </dialog>
  <script src="popup.js"></script>
</body>
</html>
